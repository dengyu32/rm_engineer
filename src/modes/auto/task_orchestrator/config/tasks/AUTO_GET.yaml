version: 1

AUTO_GET:
  steps:
    - id: select_slot
      kind: slot.select_take
      outputs: [SlotID]

    - id: move_to_slot
      kind: arm.move_joints
      timeout_ms: 8000
      max_retries: 1
      inputs: [SlotID]
      bindings:
        - from: SlotID
          to_param: target_joints
          op: index_to_joints_table
          table: SLOTS

    - id: unlock_slot
      kind: slot.unlock
      inputs: [SlotID]
      bindings:
        - from: SlotID
          to_param: slot_id
          op: direct

    - id: gripper_close
      kind: gripper.close
      post_delay_ms: 600

    - id: move_home
      kind: arm.move_joints
      timeout_ms: 8000
      max_retries: 1
      params:
        target_joints:
          type: double_array
          preset: HOME
