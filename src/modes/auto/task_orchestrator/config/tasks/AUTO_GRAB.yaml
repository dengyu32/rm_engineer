version: 1

AUTO_GRAB:
  steps:
    - id: vision_detect
      kind: vision.detect
      timeout_ms: 3000
      max_retries: 0
      outputs: [VisionPose, VisionVector]

    - id: approach_to_grab
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      inputs: [VisionPose]
      bindings:
        - from: VisionPose
          to_param: target_pose
          op: direct

    - id: gripper_close
      kind: gripper.cmd
      post_delay_ms: 600
      params:
        action: close

    - id: lift_cartesian
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      inputs: [VisionVector]
      bindings:
        - from: VisionVector
          to_param: target_vector
          op: direct

    - id: move_home
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      params:
        target_joints:
          type: double_array
          preset: HOME
