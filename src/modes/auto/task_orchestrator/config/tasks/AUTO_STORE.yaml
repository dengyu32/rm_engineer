version: 1

AUTO_STORE:
  steps:
    - id: select_slot
      kind: slot.select
      outputs: [SlotID]
      params:
        strategy: put

    - id: move_to_place_slot
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      inputs: [SlotID]
      bindings:
        - from: SlotID
          to_param: target_joints
          op: index_to_joints_table
          table: SLOTS

    - id: gripper_open
      kind: gripper.cmd
      post_delay_ms: 600
      params:
        action: open

    - id: lock_slot
      kind: slot.lock
      inputs: [SlotID]
      bindings:
        - from: SlotID
          to_param: slot_id
          op: direct

    - id: move_home
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      params:
        target_joints:
          type: double_array
          preset: HOME
