version: 1

TEST_CARTESIAN:
  steps:
    - id: approach_normal
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      params:
        target_pose: [-0.63131, -0.052031, 0.67485, -0.18348, -0.64249, 0.27727, 0.6904]

    - id: gripper_close
      kind: gripper.cmd
      post_delay_ms: 200
      params:
        action: close

    - id: take_out_cartesian
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      params:
        target_vector: [0.10315, 0.122381, -0.09803]

    - id: gripper_open
      kind: gripper.cmd
      params:
        action: open
