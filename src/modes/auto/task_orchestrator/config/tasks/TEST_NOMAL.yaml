version: 1

TEST_NOMAL:
  steps:

    - id: approach_normal_1
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      params:
        target_pose:
          type: double_array
          preset: POSE_1

    - id: gripper_close
      kind: gripper.cmd
      post_delay_ms: 200
      params:
        action: close

    - id: approach_normal_2
      kind: arm.move
      timeout_ms: 8000
      max_retries: 1
      params: 
        target_pose:
          type: double_array
          preset: POSE_2

    - id: gripper_open
      kind: gripper.cmd
      params:
        action: open