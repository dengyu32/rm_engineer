version: 1

TEST_VISION:
  steps:
    - id: vision_detect
      kind: vision.detect
      timeout_ms: 3000
      max_retries: 0
      outputs: [VisionPose, VisionVector]

    - id: vision_approach
      kind: arm.move_pose
      timeout_ms: 8000
      max_retries: 1
      inputs: [VisionPose]
      bindings:
        - from: VisionPose
          to_param: target_pose
          op: direct

    - id: vision_cartesian
      kind: arm.move_vector
      timeout_ms: 8000
      max_retries: 1
      inputs: [VisionVector]
      params:
        target_length: 0.08
      bindings:
        - from: VisionVector
          to_param: target_vector
          op: direct
